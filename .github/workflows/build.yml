name: Build Android APK

# Manual-only: builds happen when YOU tap "Run workflow" in the Actions tab,
# not on every file upload (stops the junk-run flood and notification emails).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper and Keys
        run: |
          # Generate gradlew and wrapper jar if missing
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing. Generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

          # Generate debug.keystore so signingConfig doesn't fail
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env file exists for secrets plugin
          touch .env

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nano-browser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
